name: json_fields
description: >-
  Generates type-safe, compile-time-checked JSON field path accessors for
  classes annotated with @JsonSerializable. Ideal for Firebase partial updates.

version: 0.1.0

repository: https://github.com/BirjuVachhani/json_fields

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: '>=10.0.0 <14.0.0'
  build: ">=4.0.0 <5.0.0"
  json_annotation: ">=4.11.0 <5.0.0"
  source_gen: ">=4.2.0 <5.0.0"
  source_helper: ">1.3.0 <2.0.0"
  code_builder: ">4.11.0 <5.0.0"

dev_dependencies:
  build_runner: ">=2.12.0 <3.0.0"
  build_test: ^3.5.15
  json_serializable: ">=6.13.0 <7.0.0"
  lints: ^6.1.0
  test: ^1.31.1

topics:
  - json
  - codegen
  - build-runner
  - firebase
  - json-serializable